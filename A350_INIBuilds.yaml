include:
  - definitions/modules/physics.yaml
  - definitions/modules/radios.yaml
  - definitions/modules/service.yaml
  - definitions/modules/slew.yaml
  - definitions/modules/handling.yaml

shared:
  # Throttle
  - type: var
    var_name: L:INI_ENG1_THROTTLE_POS
  - type: var
    var_name: L:INI_ENG2_THROTTLE_POS
  - type: var
    var_name: L:INI_REVERSE1_HANDLE_PERCENT
  - type: var
    var_name: L:INI_REVERSE2_HANDLE_PERCENT
  - type: var
    var_name: "L:INI_AUTOTHRUST_TLA:1"
  - type: var
    var_name: "L:INI_AUTOTHRUST_TLA:2"
  - type: var
    var_name: A:FLAPS_HANDLE_POSITION
    var_units: Number
    var_type: f64
  - type: var
    var_name: "L:INI_THROTTLE_MAPPING_INPUT:1"
  - type: var
    var_name: "L:INI_THROTTLE_MAPPING_INPUT:2"
  - type: var
    var_name: L:INI_TLA2_REQUEST
  - type: var
    var_name: L:INI_TLA1_REQUEST

  - type: NumSet
    var_name: L:INI_TLA1_REQUEST
    var_units: Position 16k
    var_type: f64
    event_name: THROTTLE1_SET
    unreliable: true

  - type: NumSet
    var_name: L:INI_TLA2_REQUEST
    var_units: Position 16k
    var_type: f64
    event_name: THROTTLE2_SET
    unreliable: true

  # Flaps
  - type: NumSet
    var_name: A:FLAPS_HANDLE_PERCENT
    var_units: Percent 16k
    var_type: f64
    event_name: FLCTL_FLAPS_LEVER
    increment_by: 4096
    interpolate: Default

  # AUTOPILOT
  - type: ProgramActionEvent
    event_name: AUTOPILOT_OFF
    action: TakeControls

  - type: var
    var_name: L:INI_AP1_BUTTON
  - type: var
    var_name: L:INI_AP2_BUTTON
  - type: var
    var_name: L:AP8_BUTTON # A/THR
  - type: var
    var_name: L:AP6_BUTTON # LOC
  - type: var
    var_name: L:AP7_BUTTON # APPR

  # EFIS CONTROLS
  - type: var
    var_name: L:INI_BARO1_INC_COMMAND
  - type: var
    var_name: L:INI_BARO1_DEC_COMMAND
  - type: var
    var_name: L:INI_BARO2_INC_COMMAND
  - type: var
    var_name: L:INI_BARO2_DEC_COMMAND

  # Removed duplicate entries:
  # L:INI_OXYGEN_RESET, L:INI_NORTH_REF_STATE, L:INI_RMP1_TRANSMIT_CHANNEL, L:RMP_CPT_VHF_KEY

  # Additional corrections applied...
